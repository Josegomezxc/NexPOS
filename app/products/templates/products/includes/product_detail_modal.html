{# Modal de detalle del producto — reutilizado en el listado y en el detalle de mensajes #}
<div class="modal fade" id="productModal" tabindex="-1" role="dialog" aria-labelledby="productModalLabel" aria-hidden="true">
    <div class="modal-dialog modal-dialog-centered" role="document">
        <div class="modal-content shadow-lg border-0">
            <div class="modal-header bg-primary text-white">
                <h5 class="modal-title font-weight-bold" id="productModalLabel">
                    <i class="fas fa-utensils"></i> Detalle del producto
                </h5>
                <button type="button" class="close text-white" data-dismiss="modal" aria-label="Cerrar">
                    <span aria-hidden="true">&times;</span>
                </button>
            </div>
            <div class="modal-body">
                <div class="text-center mb-3" id="modal-image-wrap"></div>
                <h4 class="mb-1" id="modal-nombre"></h4>
                <span class="badge mb-3" id="modal-categoria"></span>
                <p class="text-muted mb-3" id="modal-descripcion"></p>
                <div class="d-flex justify-content-between align-items-center bg-light rounded p-3">
                    <div>
                        <div class="small text-muted text-uppercase">Precio de venta</div>
                        <div class="h3 mb-0 text-warning font-weight-bold" id="modal-precio"></div>
                    </div>
                    <div>
                        <div class="small text-muted text-uppercase">Estado</div>
                        <div id="modal-estado"></div>
                    </div>
                </div>
            </div>
            <div class="modal-footer justify-content-center">
                <a href="#" id="modal-btn-editar" class="btn btn-primary">
                    <i class="fas fa-pencil-alt"></i> Editar
                </a>
                <a href="#" id="modal-btn-desactivar" class="btn btn-outline-danger btn-confirm">
                    <i class="fas fa-toggle-off"></i> Desactivar
                </a>
                <form method="post" action="" id="modal-form-activar" class="m-0 d-none">
                    {% csrf_token %}
                    <button type="submit" class="btn btn-success">
                        <i class="fas fa-toggle-on"></i> Reactivar
                    </button>
                </form>
                <button type="button" class="btn btn-outline-secondary" data-dismiss="modal">
                    <i class="fas fa-times"></i> Cerrar
                </button>
            </div>
        </div>
    </div>
</div>
